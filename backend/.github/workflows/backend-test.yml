name: Backend Unit Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]
    
    steps:
      
      - name: Checkout Repository
        uses: action/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      
      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: npm test